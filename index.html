<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELORA - Timeless Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&family=Noto+Sans+Sinhala:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #c5a059; --cream: #fbf9f6; --dark: #1a1a1a; }
        body { background-color: var(--cream); color: var(--dark); font-family: 'Lato', sans-serif; overflow-x: hidden; }
        
        /* Typography */
        h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }
        .sinhala { font-family: 'Noto Sans Sinhala', sans-serif; }
        
        /* 3D Background */
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.5; pointer-events: none; }
        
        /* Navbar Glass Effect */
        .glass-nav { background: rgba(251, 249, 246, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(197, 160, 89, 0.15); }
        
        /* Chat Styling */
        .chat-ai { background-color: #f4f1ea; color: #333; border-left: 3px solid var(--gold); border-radius: 4px 12px 12px 12px; font-size: 0.9rem; }
        .chat-user { background-color: #2d2d2d; color: white; border-radius: 12px 4px 12px 12px; font-size: 0.9rem; }
        
        /* Error Styling */
        .chat-error { 
            background-color: #ffe4e6; 
            color: #991b1b; 
            border: 1px solid #fecaca; 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 0.85rem; 
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Kina AI Branding */
        .kina-footer { font-size: 10px; color: #9ca3af; text-align: center; margin-top: 8px; letter-spacing: 0.05em; }
        .kina-footer span { color: var(--gold); font-weight: bold; }
    </style>
</head>
<body class="antialiased selection:bg-yellow-200 selection:text-black">

    <div id="canvas-container"></div>

    <nav class="glass-nav fixed w-full top-0 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="flex flex-col">
                    <h1 class="text-3xl font-bold tracking-[0.2em] text-gray-900 serif">VELORA</h1>
                    <span class="text-[9px] uppercase tracking-[0.4em] text-yellow-600 mt-1 pl-1">Luxury Collection</span>
                </div>
            </div>
            <div onclick="toggleCart()" class="cursor-pointer relative group p-2 hover:bg-yellow-50 rounded-full transition duration-300">
                <span class="text-2xl opacity-80 group-hover:opacity-100">🛒</span>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-yellow-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow-md">0</span>
            </div>
        </div>
    </nav>

    <header class="pt-44 pb-20 text-center px-4 fade-in">
        <p class="text-xs font-bold tracking-[0.3em] text-yellow-600 uppercase mb-4">New Arrivals</p>
        <h2 class="text-5xl md:text-7xl text-gray-900 serif italic mb-8">Timeless Elegance</h2>
        <div class="w-20 h-[2px] bg-yellow-600 mx-auto opacity-60"></div>
    </header>

    <main id="product-container" class="max-w-7xl mx-auto px-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-10 pb-40">
        <div class="col-span-full text-center py-20">
            <div class="inline-block w-8 h-8 border-4 border-yellow-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-gray-400 text-xs mt-4 tracking-widest uppercase">Curating Collection...</p>
        </div>
    </main>

    <button onclick="toggleChat()" class="fixed bottom-8 right-8 bg-gray-900 text-white p-4 rounded-full shadow-2xl z-50 hover:bg-yellow-600 transition transform hover:-translate-y-1 flex items-center gap-3 group">
        <span class="text-xl">✨</span>
        <span class="max-w-0 overflow-hidden group-hover:max-w-xs transition-all duration-500 font-bold text-xs uppercase tracking-wider whitespace-nowrap">Ask Assistant</span>
    </button>

    <div id="chat-window" class="hidden fixed bottom-24 right-8 w-80 md:w-96 bg-white rounded-2xl shadow-2xl border border-gray-100 z-50 flex flex-col h-[550px] overflow-hidden transform transition-all duration-300">
        <div class="bg-gray-900 p-5 flex justify-between items-center relative overflow-hidden">
            <div class="absolute inset-0 bg-yellow-600/10"></div>
            <div class="relative z-10">
                <h3 class="font-bold text-white serif tracking-wide text-lg">VELORA AI</h3>
                <p class="text-[10px] text-gray-400 uppercase tracking-wider">Personal Concierge</p>
            </div>
            <button onclick="toggleChat()" class="text-gray-400 hover:text-white transition z-10 text-xl">×</button>
        </div>
        
        <div id="chat-messages" class="flex-1 p-5 overflow-y-auto space-y-4 bg-[#fafafa] text-sm sinhala">
            <div class="chat-ai p-4 shadow-sm">
                Hello! Welcome to VELORA. How can I assist you with your jewelry or item needs today?
            </div>
        </div>

        <div class="p-4 bg-white border-t border-gray-100">
            <div class="flex items-center gap-2 bg-gray-50 p-2 rounded-xl border border-gray-200 focus-within:border-yellow-500 transition duration-300">
                <input id="user-input" type="text" placeholder="Type here..." class="flex-1 bg-transparent outline-none text-sm text-gray-700 font-sinhala px-2 py-1">
                <button onclick="sendMessage()" class="bg-yellow-600 text-white w-8 h-8 rounded-lg hover:bg-gray-900 transition flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7" /></svg>
                </button>
            </div>
            <div class="kina-footer">Powered by <span>kina ai</span></div>
        </div>
    </div>

    <div id="cart-modal" class="hidden fixed inset-0 bg-gray-900/30 backdrop-blur-sm z-50 flex justify-end transition-opacity duration-300">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col transform transition-transform">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h2 class="text-2xl font-bold serif text-gray-800">Shopping Bag</h2>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-red-500 transition text-2xl">×</button>
            </div>
            <ul id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-6"></ul>
            <div class="p-6 bg-gray-50 border-t border-gray-100">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-gray-500 font-medium uppercase text-xs tracking-widest">Total Estimated</span>
                    <span class="text-2xl font-bold text-gray-900 serif">Rs. <span id="cart-total">0</span></span>
                </div>
                <button onclick="checkoutWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg transition flex justify-center items-center gap-3">
                    <span>Confirm via WhatsApp</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBoRUkCAhDUfabz2HVv3WO_IvgOHl1bjG8",
            authDomain: "velora-ea392.firebaseapp.com",
            projectId: "velora-ea392",
            storageBucket: "velora-ea392.firebasestorage.app",
            messagingSenderId: "190374917970",
            appId: "1:190374917970:web:ef4324bff42880b6e32c8b",
            measurementId: "G-006QHPS187"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // ==========================================
        // ✅ UPDATED KEY & MODEL ✅
        // ==========================================
        const GROQ_API_KEY = "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"; 
        // ==========================================

        // --- THREE.JS BACKGROUND ---
        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);
            
            // Gold Particles
            const particlesGeometry = new THREE.BufferGeometry();
            const count = 450; 
            const posArray = new Float32Array(count * 3);
            for(let i = 0; i < count * 3; i++) posArray[i] = (Math.random() - 0.5) * 16;
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const material = new THREE.PointsMaterial({ size: 0.04, color: 0xc5a059, transparent: true, opacity: 0.6 });
            const mesh = new THREE.Points(particlesGeometry, material);
            scene.add(mesh);
            camera.position.z = 4;
            
            function animate() {
                mesh.rotation.y += 0.0008; 
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }
            animate();
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        }
        initThreeJS();

        // --- SHOP & CART LOGIC ---
        let cart = [];
        async function loadProducts() {
            const container = document.getElementById('product-container');
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                container.innerHTML = ''; 
                if (querySnapshot.empty) { container.innerHTML = '<p class="col-span-full text-center text-gray-400 text-sm">No items yet.</p>'; return; }
                querySnapshot.forEach((docSnap) => {
                    const item = docSnap.data();
                    const whatsappLink = item.catalogLink ? `<a href="${item.catalogLink}" target="_blank" class="text-[10px] text-yellow-600 font-bold uppercase hover:underline mb-2 block">Catalog ↗</a>` : '';
                    container.innerHTML += `<div class="group bg-white rounded-xl p-4 shadow-sm hover:shadow-2xl transition-all duration-500 border border-gray-100 flex flex-col h-full relative">
                        <div class="relative overflow-hidden rounded-lg aspect-[4/5] bg-gray-50 mb-4"><img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover transform group-hover:scale-105 transition duration-700"></div>
                        <div class="text-center flex-grow flex flex-col justify-end"><h3 class="font-serif text-lg text-gray-900 mb-1">${item.name}</h3>${whatsappLink}<p class="text-gray-500 font-medium text-sm mt-1">Rs. ${item.price.toLocaleString()}</p></div>
                        <button onclick="addToCart('${docSnap.id}', '${item.name}', ${item.price})" class="mt-4 w-full bg-white border border-gray-200 text-gray-900 py-3 rounded-lg font-bold text-[10px] uppercase tracking-[0.2em] hover:bg-yellow-600 hover:text-white transition">Add to Bag</button></div>`;
                });
            } catch (e) { container.innerHTML = '<p class="col-span-full text-center text-red-400">Loading Error.</p>'; }
        }
        window.addToCart = (id, n, p) => { cart.push({ id, n, p }); updateCartUI(); const badge = document.getElementById('cart-count'); badge.classList.add('scale-150', 'bg-red-500'); setTimeout(() => badge.classList.remove('scale-150', 'bg-red-500'), 300); };
        window.toggleCart = () => document.getElementById('cart-modal').classList.toggle('hidden');
        window.removeFromCart = (index) => { cart.splice(index, 1); updateCartUI(); };
        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const list = document.getElementById('cart-items');
            let total = 0; list.innerHTML = '';
            cart.forEach((item, index) => { total += item.p; list.innerHTML += `<li class="flex gap-4 items-center border-b border-gray-50 pb-4"><div class="w-12 h-12 bg-gray-50 rounded flex items-center justify-center text-lg">✨</div><div class="flex-1"><h4 class="font-bold text-gray-800 text-sm serif">${item.n}</h4><p class="text-xs text-gray-500">Rs. ${item.p.toLocaleString()}</p></div><button onclick="removeFromCart(${index})" class="text-gray-300 hover:text-red-500">✕</button></li>`; });
            document.getElementById('cart-total').innerText = total.toLocaleString();
        }
        window.checkoutWhatsApp = async () => {
            if (cart.length === 0) return alert("Bag is empty!");
            cart.forEach(async (item) => { try { const productRef = doc(db, "products", item.id); await updateDoc(productRef, { clicks: increment(1) }); } catch(e) {} });
            let msg = "*ORDER - VELORA* 💍\n\n"; let total = 0;
            cart.forEach(item => { msg += `▪ ${item.n} : Rs. ${item.p}\n`; total += item.p; });
            msg += `\n*TOTAL: Rs. ${total.toLocaleString()}*`;
            window.open(`https://wa.me/94717148469?text=${encodeURIComponent(msg)}`, '_blank');
        };

        // --- UPDATED AI CHAT LOGIC ---
        window.toggleChat = () => document.getElementById('chat-window').classList.toggle('hidden');

        window.sendMessage = async () => {
            const input = document.getElementById('user-input');
            const msg = input.value; if (!msg) return;
            
            addMsg(msg, 'user');
            input.value = '';
            
            const loadingId = addMsg("Thinking...", 'ai');

            // 1. KEY CHECK
            if (!GROQ_API_KEY || GROQ_API_KEY.includes("PASTE_")) {
                document.getElementById(loadingId).remove();
                addMsg("⚠️ API Key Error: Please check index.html code.", 'error');
                return;
            }

            try {
                // 2. TIMEOUT (10s)
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);

                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        // ✅ FIX: CHANGED TO SUPPORTED MODEL ✅
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: "You are Velora AI. Answer briefly and professionally." },
                            { role: "user", content: msg }
                        ]
                    }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);

                // 3. ERROR HANDLING
                if (!res.ok) { 
                    const text = await res.text();
                    throw new Error(`Server Error: ${res.status} | ${text}`); 
                }

                const data = await res.json();
                document.getElementById(loadingId).remove();
                addMsg(data.choices[0].message.content, 'ai');

            } catch (error) {
                document.getElementById(loadingId).remove();
                console.error("Debug:", error);
                
                let errorText = "Unknown Error";
                if (error.name === 'AbortError') errorText = "⚠️ Timeout: Server slow.";
                else if(error.message.includes("401")) errorText = "🛑 Error 401: Invalid API Key.";
                else if(error.message.includes("Failed to fetch")) errorText = "⚠️ Network Error.";
                else errorText = "⚠️ Error: " + error.message;
                
                addMsg(errorText, 'error');
            }
        };

        function addMsg(text, type) {
            const box = document.getElementById('chat-messages');
            const div = document.createElement('div');
            let className = 'chat-ai p-4 shadow-sm';
            if (type === 'user') className = 'chat-user p-4 shadow-sm self-end';
            if (type === 'error') className = 'chat-error self-center';
            div.className = className; div.innerText = text;
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${type === 'user' ? 'justify-end' : 'justify-start'}`;
            wrapper.appendChild(div); box.appendChild(wrapper); box.scrollTop = box.scrollHeight;
            return div.id; 
        }

        loadProducts();
    </script>
</body>
</html>
